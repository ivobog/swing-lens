profiles:
  momentum_swing:
    enabled: true
    label: "Momentum Swing"
    description: "Technical-led swing ranking with fundamental confirmation."
    weights:
      technical: 0.55
      fundamental: 0.45
    technical_components:
      momentum_strength: 0.30
      momentum_health: 0.25
      trend_quality: 0.15
      setup_quality: 0.10
      breakout_or_vcp_quality: 0.10
      risk_control: 0.10
    missing_data_policy:
      rescale_available: true
      penalty: 1.0
    tradeability_overlay:
      enabled: true
      poor_penalty: 0.5
      very_poor_penalty: 1.0
      maximum_penalty: 1.0
      minimum_dollar_volume: 5000000
    thresholds:
      strong_candidate_min_score: 8.0
      candidate_min_score: 6.8
      watch_min_score: 5.5
    penalties:
      danger_classification: 3.0
      overheated_momentum: 1.5
      liquidity_warning: 1.0
      earnings_blocked: 3.0
      earnings_high_risk: 2.0
      earnings_medium_risk: 1.0
      missing_data: 1.0
      value_trap_risk: 1.5
      growth_trap_risk: 1.5
      quality_risk: 1.5
    gates:
      earnings_block: true
      danger_blocks_candidate: true
      fundamental_floor:
        enabled: true
        min_score: 3.0
        max_decision: "Speculative watch"

