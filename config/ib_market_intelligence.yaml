engine:
  enabled: false
  calculation_version: ibmi-1.0.0
  config_version: 2026-08-09
  source_version: ibkr-tws-flex-v1

request_budget:
  historical_requests_per_minute: 15
  historical_min_spacing_seconds: 3.0
  tws_min_spacing_seconds: 0.25
  request_max_attempts: 3
  retry_initial_seconds: 1.0
  retry_max_seconds: 30.0
  historical_chunk_days: 60
  live_snapshot_concurrency: 10
  market_data_line_cap: 100
  shortlist_limit: 25
  bid_ask_weight: 2
  default_weight: 1

freshness:
  historical_max_age_days: 5
  live_max_age_minutes: 30
  histogram_max_age_days: 5

liquidity:
  enabled: false
  lookback_sessions: 20
  short_window_sessions: 5
  percentile_window_sessions: 60
  minimum_dollar_volume: 1000000
  use_rth: true
  spread_grade_pct:
    excellent_max: 0.10
    good_max: 0.25
    acceptable_max: 0.50
    poor_max: 1.00

short_pressure:
  enabled: false
  fee_rate_lookback_sessions: 60
  live_shortable_shares: true
  high_fee_rate_pct: 10
  extreme_fee_rate_pct: 25
  low_availability_shares: 100000
  very_low_availability_shares: 25000

volatility:
  enabled: false
  lookback_sessions: 252
  iv_hv_high_ratio: 1.50
  iv_hv_extreme_ratio: 2.00
  iv_expansion_window: 20
  ceri_risk_max_contribution: 1.5

options_activity:
  enabled: false
  shortlist_only: true
  generic_ticks: [100, 101, 105]
  call_heavy_ratio_max: 0.7
  put_heavy_ratio_min: 1.3
  abnormal_activity_multiple: 2.0

scanner:
  enabled: false
  max_active_scans: 10
  max_results: 50
  presets:
    - name: HOT_VOLUME_US
      version: "1"
      instrument: STK
      location: STK.US.MAJOR
      scan_code: HOT_BY_VOLUME
      max_results: 50
      filters:
        - {tag: priceAbove, value: "5"}
        - {tag: volumeAbove, value: "500000"}
    - name: TOP_GAINERS_US
      version: "1"
      instrument: STK
      location: STK.US.MAJOR
      scan_code: TOP_PERC_GAIN
      max_results: 50
      filters:
        - {tag: priceAbove, value: "5"}
    - name: MOST_ACTIVE_US
      version: "1"
      instrument: STK
      location: STK.US.MAJOR
      scan_code: MOST_ACTIVE
      max_results: 50
      filters: []
    - name: OPTIONS_VOLUME_US
      version: "1"
      instrument: STK
      location: STK.US.MAJOR
      scan_code: HOT_BY_OPT_VOLUME
      max_results: 50
      filters:
        - {tag: priceAbove, value: "5"}

histogram:
  enabled: false
  period: "20 days"
  use_rth: true
  shortlist_only: true
  high_activity_fraction: 0.70
  low_activity_percentile: 0.20

flex:
  enabled: false
  import_trade_confirmations: true
  import_activity_daily: true
  mask_account_id: true
  research_lookback_sessions: 5
  matching_policy_version: latest-completed-before-entry-v1
