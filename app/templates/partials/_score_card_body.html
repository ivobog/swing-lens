      {% if card["badges"] %}
        <div class="badge-list">
          {% for badge in card["badges"] %}
            <span class="badge badge-{{ badge['tone'] }}">{{ badge["label"] }}</span>
          {% endfor %}
        </div>
      {% endif %}
      <dl class="score-list">
        {% for item in card["items"] %}
          <div class="score-item">
            <dt>{{ item["label"] }}</dt>
            <dd class="score-value {{ item['tone'] }}">{{ item["value"] }}</dd>
          </div>
        {% endfor %}
      </dl>
